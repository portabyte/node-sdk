name: Verify SDK

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v6
      # pnpm/setup installs pnpm's standalone executable, so the pnpm 11
      # pinned in package.json works even while this job tests Node 18 or 20.
      - uses: pnpm/setup@v2
        with:
          install: false
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      # ESLint 10 no longer supports Node 18. The runtime still is covered by
      # the tests, typecheck, build, and package validation below.
      - if: matrix.node != 18
        run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run typecheck
      - run: pnpm build
      - run: npm pack --dry-run

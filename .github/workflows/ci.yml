name: Verify SDK

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pnpm 11 requires Node 22.13+, so use pnpm 10 when checking the
          # SDK's supported Node 18 and 20 runtimes.
          - node: 18
            pnpm: 10
            lint: false
          - node: 20
            pnpm: 10
            lint: true
          - node: 22
            pnpm: 11.9.0
            lint: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ESLint 10 no longer supports Node 18. The runtime still is covered by
      # the tests, typecheck, build, and package validation below.
      - if: matrix.lint
        run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run typecheck
      - run: pnpm build
      - run: npm pack --dry-run

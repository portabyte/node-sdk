name: Publish SDK

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          install: false
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - id: version
        name: Check release and npm publication status
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          fi
          if npm view "$PACKAGE_NAME@$VERSION" version --json >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        if: steps.version.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --target "$GITHUB_SHA" --generate-notes --title "${{ steps.version.outputs.tag }}"
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
